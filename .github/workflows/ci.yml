name: PHP Email Validator CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  php-tests:
    name: PHP ${{ matrix.php-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The library itself supports PHP >= 8.0 (see php80-compat job below).
        # The test toolchain (PHPUnit >= 10, which the attribute-based tests
        # require) needs PHP >= 8.1, so the full suite runs from 8.1 upwards.
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        exclude:
          # PHP 8.5 may not be available on all platforms yet
          - os: windows-latest
            php-version: '8.5'
          - os: macos-latest
            php-version: '8.5'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json, intl, filter
          coverage: xdebug
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist --optimize-autoloader

      - name: Run Tests
        run: composer test
        env:
          XDEBUG_MODE: coverage

  php80-compat:
    name: PHP 8.0 runtime compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.0
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, json, intl, filter
          tools: composer:v2

      # The dev toolchain (PHPUnit >= 10) requires PHP 8.1, so on 8.0 we only
      # verify that the runtime package installs, lints and autoloads cleanly.
      # --ignore-platform-reqs lets the resolver see the dev packages without
      # tripping on their platform constraints; --no-dev means they are never
      # installed, so only the runtime deps (psr/*) land and the smoke test runs
      # on real PHP 8.0.
      - name: Install runtime dependencies only
        run: composer update --no-dev --ignore-platform-reqs --no-progress --prefer-dist

      # xargs (unlike find -exec ... \;) propagates a failing `php -l`.
      - name: Check PHP syntax (runtime sources)
        run: |
          find src -name "*.php" -not -path "src/Framework/*" -print0 | xargs -0 -n1 php -l
          php -l bin/email-validator

      - name: Smoke test autoload
        run: |
          php -r 'require "vendor/autoload.php";
            $v = new HarunGecit\EmailValidator\EmailValidator();
            $count = count(HarunGecit\EmailValidator\Fetcher::loadBlocklist());
            if ($count < 100000) { fwrite(STDERR, "blocklist too small: {$count}\n"); exit(1); }
            if (!$v->checkDisposable("user@eu.mailinator.com")->isDisposable()) { fwrite(STDERR, "detection failed\n"); exit(1); }
            echo "OK: EmailValidator loads on PHP " . PHP_VERSION . ", blocklist has {$count} domains\n";'

      - name: Smoke test CLI
        run: |
          php bin/email-validator stats
          php bin/email-validator check user@gmail.com
          if php bin/email-validator check user@mailinator.com; then echo "expected exit code 1" >&2; exit 1; fi

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, intl, filter
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist

      - name: Check PHP syntax
        run: |
          find src tests scripts -name "*.php" -print0 | xargs -0 -n1 php -l
          php -l bin/email-validator

      - name: Validate bundled data
        run: |
          test "$(grep -c . data/blocklist.conf)" -gt 100000
          php -r '$index = require "data/blocklist.php";
            $count = count(file("data/blocklist.conf", FILE_SKIP_EMPTY_LINES));
            if (count($index) !== $count) { fwrite(STDERR, "data/blocklist.php is out of sync\n"); exit(1); }
            echo "Compiled index OK ({$count} domains)\n";'
