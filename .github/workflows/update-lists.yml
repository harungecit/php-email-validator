name: Update Disposable Domain Lists

# Daily: rebuilds data/blocklist.conf (+ compiled index and metadata) from all
# upstream sources (see scripts/update-lists.php) and commits it to main when it
# changed and the test suite still passes. Applications that run
# `email-validator sync` pick these daily updates up straight from main.
#
# Weekly (Mondays) or on demand: publishes the accumulated data changes as a
# patch release (tag + GitHub release) so `composer update` delivers them.
# Packagist picks the new tag up through its GitHub hook. A release is skipped
# when main contains unreleased code changes — those need a manual release.

on:
  schedule:
    # Every day at 03:17 UTC
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip the shrink safety check (pass --force to the update script)'
        type: boolean
        default: false
      release:
        description: 'Publish a patch release now if data changed since the last tag (otherwise only on Mondays)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-lists
  cancel-in-progress: false

jobs:
  update-lists:
    name: Update lists (and release on Mondays)
    runs-on: ubuntu-latest
    # Scheduled runs are disabled on forks
    if: github.event_name == 'workflow_dispatch' || github.repository == 'harungecit/php-email-validator'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, intl, filter, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist

      - name: Update lists from upstream
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            php scripts/update-lists.php --force | tee update-summary.txt
          else
            php scripts/update-lists.php | tee update-summary.txt
          fi

      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Lists are already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "added=$(git diff --numstat -- data/blocklist.conf | cut -f1)" >> "$GITHUB_OUTPUT"
            echo "removed=$(git diff --numstat -- data/blocklist.conf | cut -f2)" >> "$GITHUB_OUTPUT"
            echo "total=$(grep -c . data/blocklist.conf)" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh domain counts in README
        if: steps.changes.outputs.changed == 'true'
        env:
          TOTAL: ${{ steps.changes.outputs.total }}
        run: |
          rounded=$(( TOTAL / 100 * 100 ))
          formatted=$(echo "$rounded" | sed -E ':a;s/^([0-9]+)([0-9]{3})/\1,\2/;ta')
          sed -i -E "s#badge/blocklist-[0-9,]+%2B#badge/blocklist-${formatted}%2B#g" README.md
          sed -i -E "s#[0-9]{1,3}(,[0-9]{3})*\+ disposable domains#${formatted}+ disposable domains#g" README.md

      - name: Run tests
        if: steps.changes.outputs.changed == 'true'
        run: composer test

      - name: Commit and push data update
        if: steps.changes.outputs.changed == 'true'
        env:
          ADDED: ${{ steps.changes.outputs.added }}
          REMOVED: ${{ steps.changes.outputs.removed }}
          TOTAL: ${{ steps.changes.outputs.total }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          git commit -m "Update disposable blocklist (+${ADDED} / -${REMOVED}, ${TOTAL} domains)"
          git push origin main

      - name: Decide on a release
        id: release
        env:
          FORCE_RELEASE: ${{ inputs.release }}
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            echo "No existing version tag found." >&2
            exit 1
          fi

          if [ "$(date -u +%u)" != "1" ] && [ "$FORCE_RELEASE" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Not a release day; data changes accumulate until Monday."
            exit 0
          fi

          if git diff --quiet "$latest" HEAD -- data/blocklist.conf data/allowlist.conf; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No data changes since ${latest}."
            exit 0
          fi

          if ! git diff --quiet "$latest" HEAD -- . ':(exclude)data' ':(exclude)README.md'; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::main has unreleased code changes since ${latest}; skipping the automatic data release. Publish a release manually."
            exit 0
          fi

          git show "${latest}:data/blocklist.conf" | sort > previous.txt
          sort data/blocklist.conf > current.txt
          IFS='.' read -r major minor patch <<< "${latest#v}"

          {
            echo "publish=true"
            echo "tag=v${major}.${minor}.$((patch + 1))"
            echo "previous=${latest}"
            echo "added=$(comm -13 previous.txt current.txt | grep -c . || true)"
            echo "removed=$(comm -23 previous.txt current.txt | grep -c . || true)"
            echo "total=$(grep -c . data/blocklist.conf)"
          } >> "$GITHUB_OUTPUT"

      - name: Tag and publish release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
          ADDED: ${{ steps.release.outputs.added }}
          REMOVED: ${{ steps.release.outputs.removed }}
          TOTAL: ${{ steps.release.outputs.total }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG: disposable blocklist update"
          git push origin "$TAG"

          {
            echo "Automated data release: the disposable domain blocklist was rebuilt from"
            echo "[disposable-email-domains](https://github.com/disposable-email-domains/disposable-email-domains) (curated) and"
            echo "[eramitgupta/disposable-email](https://github.com/eramitgupta/disposable-email) (aggregated, false-positive filtered)."
            echo
            echo "- Domains added since ${PREVIOUS}: **${ADDED}**"
            echo "- Domains removed since ${PREVIOUS}: **${REMOVED}**"
            echo "- Blocklist size: **${TOTAL}** domains"
            echo
            echo "No code changes. Full diff: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${TAG}"
            if [ -f update-summary.txt ]; then
              echo
              echo 'Latest build:'
              echo '```'
              cat update-summary.txt
              echo '```'
            fi
          } > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
